<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finora Budget UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#020817] flex items-center justify-center h-screen p-4">
    
    <div class="bg-[#0f172a] border border-slate-800 rounded-xl shadow-2xl p-6 w-full max-w-md text-slate-100">
        <div class="flex justify-between items-center mb-1">
            <h2 class="text-base font-semibold tracking-tight">Monthly Budget (Default Account)</h2>
            <button class="h-8 w-8 rounded-md hover:bg-slate-800 flex items-center justify-center transition-colors">
                <i class="fas fa-pencil-alt text-slate-400 text-sm"></i>
            </button>
        </div>
        
        <p class="text-sm text-slate-400 mb-6">₹13,500.00 of ₹15,000.00 spent</p>

        <div class="space-y-3">
            <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full bg-red-500 rounded-full transition-all duration-500" style="width: 90%;"></div>
            </div>

            <div class="flex justify-between items-center mt-2">
                <span class="text-xs font-medium px-2.5 py-1 bg-red-500/10 text-red-500 rounded-md border border-red-500/20">
                    <i class="fas fa-exclamation-triangle mr-1"></i> Threshold Exceeded
                </span>
                <span class="text-xs font-medium text-slate-400">90.0% used</span>
            </div>
        </div>
    </div>

</body>
</html>
